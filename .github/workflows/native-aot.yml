name: Native AOT build

on:
  push:
    branches:
      - master

concurrency:
  group: native-aot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.runtime }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            architecture: x64
          - runtime: win-arm64
            architecture: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish Native AOT application
        run: >-
          dotnet publish src/Tonono3/Tonono3.csproj
          --configuration NativeAot
          --runtime ${{ matrix.runtime }}
          --output publish/${{ matrix.runtime }}

      - name: Keep only executable and library files
        shell: pwsh
        run: |
          Get-ChildItem -Path "publish/${{ matrix.runtime }}" -Recurse -File |
            Where-Object { $_.Extension -notin '.exe', '.dll' } |
            Remove-Item -Force

      - name: Create distribution archive
        shell: pwsh
        run: |
          $publishDirectory = "publish/${{ matrix.runtime }}"
          $archivePath = "publish/Tonono3.${{ matrix.architecture }}.zip"

          Copy-Item -LiteralPath "src/Tonono3/resources/config.yaml" -Destination $publishDirectory

          $filesToArchive = Get-ChildItem -Path $publishDirectory -File
          Compress-Archive -LiteralPath $filesToArchive.FullName -DestinationPath $archivePath

      - name: Upload ${{ matrix.runtime }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tonono3-${{ matrix.architecture }}
          path: publish/Tonono3.${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7
          archive: false

  remove-previous-artifacts:
    name: Remove previous artifacts
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Remove artifacts from previous workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact_name in Tonono3.x64.zip Tonono3.arm64.zip; do
            while IFS= read -r artifact_id; do
              if [[ -n "$artifact_id" ]]; then
                gh api --method DELETE \
                  "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              fi
            done < <(
              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
                --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id"
            )
          done
